<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Touchline &middot; Five-a-Side</title>
  <link rel="stylesheet" href="../style.css?v=5">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint to avoid a flash. "auto" = no attribute.
    (function () {
      var theme = localStorage.getItem("touchline-theme");
      if (theme === "light" || theme === "dark")
        document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div class="page">
    <button id="theme-toggle" class="theme-btn" type="button" aria-label="Switch theme"></button>
    <header>
      <div class="masthead"><a href="../" style="color:inherit;text-decoration:none">Five<span class="mdot">&middot;</span>a<span class="mdot">&middot;</span>Side</a></div>
      <div class="pitchline" aria-hidden="true"></div>
      <div class="strap">
        <span id="club-crest" hidden></span>
        <span class="club-chip" id="club-label"></span>
        <span id="strap-dot" hidden>&middot;</span>
        <span class="room">touchline</span>
        <span>&middot;</span>
        <a href="../" style="color:inherit">the gaffers</a>
      </div>
    </header>

    <main id="main">
      <p class="empty">Loading&hellip;</p>
    </main>

    <footer>
      <span class="footer-line">Curated with 💙 by <a href="https://kaushikbhat.com" target="_blank" rel="noopener" style="color:inherit">kb</a> &middot;
        written each morning, read in under a minute</span>
      <span class="footer-line"><a href="../about/" style="color:inherit">about</a><span id="last-refresh" hidden></span></span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
