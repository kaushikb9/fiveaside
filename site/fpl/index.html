<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fpl · Touchline</title>
  <meta name="description" content="Touchline's FPL planner: one definitive call, a watchlist, and the fixture ticker — refreshed daily.">
  <link rel="stylesheet" href="../style.css?v=2">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint to avoid a flash. "auto" = no attribute.
    (function () {
      var theme = localStorage.getItem("touchline-theme");
      if (theme === "light" || theme === "dark")
        document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div class="page">
    <button id="theme-toggle" class="theme-btn" type="button" aria-label="Switch theme"></button>
    <header>
      <div class="masthead"><a href="../" style="color:inherit;text-decoration:none">Touchline</a></div>
      <div class="pitchline" aria-hidden="true"></div>
      <div class="strap">
        <a href="../" style="color:inherit">daily digest</a>
        <span>&middot;</span>
        <span class="club-chip">FPL planner</span>
      </div>
    </header>

    <main id="main">
      <p class="empty">Loading&hellip;</p>
    </main>

    <footer>
      <span class="footer-line">Curated with 💙 by <a href="https://kaushikbhat.com" target="_blank" rel="noopener" style="color:inherit">kb</a> &middot;
        one definitive call a week, no hype</span>
      <span class="footer-line"><a href="../about/" style="color:inherit">about</a><span id="last-refresh" hidden></span></span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
