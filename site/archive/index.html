  <script>
    // Apply the saved theme before first paint so the page never flashes the
    // wrong ground. "auto" stamps nothing and leaves prefers-color-scheme to it.
    (function () {
      try {
        var t = localStorage.getItem("fiveaside-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
