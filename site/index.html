<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Touchline</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <div class="page">
    <header>
      <div class="masthead">Touchline</div>
      <div class="pitchline" aria-hidden="true"></div>
      <div class="strap">
        <span id="club-crest" hidden></span>
        <span class="club-chip" id="club-label"></span>
        <span id="strap-dot" hidden>&middot;</span>
        <span>one page a day &mdash; no scroll, no bait</span>
      </div>
    </header>

    <main id="main">
      <p class="empty">Loading&hellip;</p>
    </main>

    <footer>Touchline &middot; written each morning by the brain, read in under a minute</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
