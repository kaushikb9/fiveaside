<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Touchline</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint to avoid a flash. "auto" = no attribute.
    (function () {
      var theme = localStorage.getItem("touchline-theme");
      if (theme === "light" || theme === "dark")
        document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div class="page">
    <button id="theme-toggle" class="theme-btn" type="button" aria-label="Switch theme"></button>
    <header>
      <div class="masthead">Touchline</div>
      <div class="pitchline" aria-hidden="true"></div>
      <div class="strap">
        <span id="club-crest" hidden></span>
        <span class="club-chip" id="club-label"></span>
        <span id="strap-dot" hidden>&middot;</span>
        <span>one page a day &mdash; no scroll, no bait</span>
      </div>
    </header>

    <main id="main">
      <p class="empty">Loading&hellip;</p>
    </main>

    <footer>Touchline &middot; written each morning by the brain, read in under a minute &middot; <a href="about/" style="color:inherit">about</a></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
