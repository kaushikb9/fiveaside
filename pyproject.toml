[project]
name = "touchline"
version = "0.1.0"
description = "A football companion that replaces the doomscroll"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.27",
]

[project.scripts]
touchline = "touchline.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchline"]
