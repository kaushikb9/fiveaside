    // a club-coloured tie under a dark suit
    fergie: (f) => '<path d="' + COLLAR + '" fill="#E8E6E0"/>' +
      '<path d="M32 55.6 L29.8 58 L32 64 L34.2 58 Z" fill="' + f.collar + '"/>',
    wenger: () => "",
    // overcoat lapels
    mourinho: (f) => '<path d="M25.6 50.6 L32 55.6 L27.6 64 L20.6 64 Z" fill="' +
      f.collar + '"/>' +
      '<path d="M38.4 50.6 L32 55.6 L36.4 64 L43.4 64 Z" fill="' + f.collar + '"/>',
    // kit collar and the chain
    cr7: (f) => '<path d="' + COLLAR + '" fill="' + f.collar + '"/>' +
      '<path d="M27.6 54.6 q4.4 5.2 8.8 0" stroke="#E8B84B" stroke-width="1.6" ' +
      'fill="none" stroke-linecap="round"/>',
    // plain white collar, nothing to prove
    xabi: (f) => '<path d="' + COLLAR + '" fill="' + f.collar + '"/>',
    // a tracksuit, zipped: the only person here dressed to run a session
    ted: (f) => '<path d="' + COLLAR + '" fill="' + f.collar + '"/>' +
      '<path d="M32 55.6 V64" stroke="' + f.collar + '" stroke-width="2.2"/>' +
      '<path d="M32 56.4 V64" stroke="#8D95A1" stroke-width="0.8"/>',
  };

  /* Props, drawn last. Only one face has one: three fingers, held up,
     unhurried, at somebody else's crowd. The forearm has to be drawn before
     the hand or the hand reads as a thumbprint stuck to the shoulder. */
  const PROP = {
    // A whistle on a cord. Every other face is identified by a feature; his
    // job needs saying too, and a whistle says assistant manager faster than
    // any amount of tracksuit.
    ted: () =>
      '<path d="M24.4 52.4 C26.6 58.6 37.4 58.6 39.6 52.4" stroke="#C8CDD4" ' +
      'stroke-width="1.1" fill="none" stroke-linecap="round"/>' +
      '<path d="M29.6 57.4 h5.6 a1.5 1.5 0 0 1 1.5 1.5 v2.2 a1.5 1.5 0 0 1 -1.5 1.5 ' +
      'h-5.6 a1.5 1.5 0 0 1 -1.5 -1.5 v-2.2 a1.5 1.5 0 0 1 1.5 -1.5 Z" fill="#D8DDE3" ' +
      'stroke="#8D95A1" stroke-width="0.6"/>' +
      '<circle cx="34.6" cy="60" r="0.8" fill="#8D95A1"/>',
    mourinho: (f) =>
      '<path d="M44 64 L55 64 L53 48 L43 50 Z" fill="' + f.coat + '"/>' +
      '<path d="M43 50 L53 48 L53.6 52 L43.6 54 Z" fill="#FFFFFF" fill-opacity=".16"/>' +
      '<path d="M45.4 52 q6 -1 8.4 0.6 v6 q-4.4 1.4 -8.4 -0.4 Z" fill="' + f.skin + '"/>' +
      '<g stroke="' + f.skin + '" stroke-width="3.2" stroke-linecap="round">' +
      '<path d="M47.4 51.6 V42.6"/><path d="M51 51.8 V41.4"/>' +
      '<path d="M54.4 52.6 V44"/></g>' +
      '<g stroke="' + f.shade + '" stroke-width="0.8" opacity=".45">' +
      '<path d="M49.2 46 v5"/><path d="M52.7 46 v5"/></g>',
  };

  /* ---- the drawing -------------------------------------------------------
     `uid` must be unique per rendered face: two of the styles clip to a path
     that lives in this SVG's own defs, and duplicate ids on one page make the
     second face clip against the first. */
  let seq = 0;

  FA.faceOf = (nick) => FACES[nick] || null;
  // Through FA.club so the door spells a club the way the rest of the site does.
  FA.faceClub = (nick) => FA.club((FACES[nick] || {}).clubName || "");
  FA.FACE_NICKS = Object.keys(FACES);

  /* The five are frozen and live in several files at once. This one is the
     only place they are DRAWN, so it says so out loud rather than quietly
     showing an initial where a face belongs. */
  FA.NICKS.forEach((n) => {
    if (!FACES[n]) console.warn("faces.js: no caricature for " + n);
  });

  FA.faceSVG = function (nick, opts) {
    const f = FACES[nick];
    const o = opts || {};
    if (!f) {
      // An unknown nickname still gets a mark rather than a hole.
      return '<svg class="face" viewBox="0 0 64 64" role="img" aria-label="' +
        esc(nick || "unknown") + '"><circle cx="32" cy="32" r="31" fill="var(--raise)" ' +
        'stroke="var(--line)"/><text x="32" y="40" text-anchor="middle" font-size="22" ' +
        'font-weight="700" fill="var(--faint)">' + esc(FA.initial(nick || "?")) +
        "</text></svg>";
    }
    const uid = "fa" + (++seq);
    const tint = TINT[f.club] || "#6B7280";
    // A face may bring its own skull and ears; most sit on the shared pair.
    const head = f.head || HEAD;
    const ears = f.ears || (EAR_L + EAR_R);
    const flat = o.flat === true;   // no disc — for a face inside a tight chip
    const dim = o.dim === true;     // not you, or not yet signed in

    return '<svg class="face' + (dim ? " dim" : "") + '" viewBox="0 0 64 64" ' +
      'role="img" aria-label="' + esc(nick) + '">' +
      "<defs>" +
      '<clipPath id="' + uid + 'd"><circle cx="32" cy="32" r="31"/></clipPath>' +
      '<clipPath id="' + uid + 'h">' + head + "</clipPath>" +
      '<linearGradient id="' + uid + 'g" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + tint + '" stop-opacity=".26"/>' +
      '<stop offset="1" stop-color="' + tint + '" stop-opacity=".08"/>' +
      "</linearGradient></defs>" +
      (flat ? "" : '<circle cx="32" cy="32" r="31" fill="url(#' + uid + 'g)"/>') +
      '<g clip-path="url(#' + uid + 'd)">' +
      // shoulders, then collar trim, then the person
      '<path d="' + COAT + '" fill="' + f.coat + '"/>' +
      (TRIM[f.style] ? TRIM[f.style](f) : "") +
      '<g fill="' + f.shade + '">' + NECK + "</g>" +
      '<g fill="' + f.skin + '">' + ears + head + "</g>" +
      STYLE[f.style](f, uid) +
      (PROP[f.style] ? PROP[f.style](f) : "") +
      "</g>" +
      (flat ? "" : '<circle cx="32" cy="32" r="30.4" fill="none" stroke="' + tint +
        '" stroke-opacity=".38" stroke-width="1.2"/>') +
      "</svg>";
  };
})();
</script>
<script>
(function(){ "use strict";
  const esc = FA.esc, face = FA.faceSVG, kit = FA.kitSVG;
  const FIVE = [
    { nick:"Sir Fergie", team:"Fergie Time FC", pts:238, rank:1 },
    { nick:"Mr CR7", team:"Siuuu United", pts:210, rank:4 },
    { nick:"Le Professeur", team:"Invincibles Reborn", pts:207, rank:5 },
    { nick:"Xabi", team:"Wabi Sabi Xabi", pts:193, rank:7 },
    { nick:"The Special One", team:"Park The Bus", pts:169, rank:9 },
  ];
  /* Ted's fresh XI for GW4. owned = how many of the five hold him this week. */
  const TED = {
    gw:4, locks:"Sat 12 Sep, 18:00", spent:99.5,
    xi:[
      { name:"Sels", team:"NFO", pos:"GK", price:5.0, fx:"AVL (A)", fdr:4, owned:0 },
      { name:"Gabriel", team:"ARS", pos:"DEF", price:8.0, fx:"SUN (A)", fdr:3, owned:0 },
      { name:"Guéhi", team:"MCI", pos:"DEF", price:6.0, fx:"MUN (A)", fdr:4, owned:0 },
      { name:"Tarkowski", team:"EVE", pos:"DEF", price:6.0, fx:"TOT (A)", fdr:3, owned:0 },
      { name:"Muñoz", team:"NFO", pos:"DEF", price:5.4, fx:"AVL (A)", fdr:4, owned:0 },
      { name:"Palmer", team:"CHE", pos:"MID", price:9.6, fx:"HUL (H)", fdr:2, owned:0, captain:true },
      { name:"Mbeumo", team:"MUN", pos:"MID", price:7.9, fx:"MCI (H)", fdr:4, owned:0 },
      { name:"Gakpo", team:"LIV", pos:"MID", price:7.1, fx:"FUL (H)", fdr:2, owned:1 },
      { name:"Wirtz", team:"LIV", pos:"MID", price:7.4, fx:"FUL (H)", fdr:2, owned:0 },
      { name:"Isak", team:"LIV", pos:"FWD", price:9.0, fx:"FUL (H)", fdr:2, owned:0, vice:true },
      { name:"Mateta", team:"CRY", pos:"FWD", price:6.4, fx:"IPS (H)", fdr:2, owned:0 },
    ],
    bench:[
      { name:"Palmer", team:"IPS", pos:"GK", price:4.0, fx:"CRY (A)", fdr:3, owned:0 },
      { name:"Rodon", team:"LEE", pos:"DEF", price:4.4, fx:"NEW (H)", fdr:2, owned:0 },
      { name:"Rice", team:"ARS", pos:"MID", price:7.4, fx:"SUN (A)", fdr:3, owned:0 },
      { name:"Wood", team:"NFO", pos:"FWD", price:5.9, fx:"AVL (A)", fdr:4, owned:0 },
    ],
    /* Only the players the five are NOT holding get a line. Gakpo is one of
       five so he gets none; the four everybody owns are not here at all. */
    why:[
      { name:"Palmer", team:"CHE", pos:"MID", price:9.6, own:"20%", owned:0,
        text:"Twenty points in two, the penalties, and Hull at Stamford Bridge next. Two of you support the club and none of you own him, which is the strangest fact in the room. He wears the armband." },
      { name:"Isak", team:"LIV", pos:"FWD", price:9.0, own:"18%", owned:0,
        text:"Three goals in two games at £9.0m, Fulham at home, and Iraola says the numbers will come if he is fit. Four of you are paying £7.5m for Calvert-Lewin in that slot." },
      { name:"Mbeumo", team:"MUN", pos:"MID", price:7.9, own:"26%", owned:0,
        text:"Twenty-one points already and the derby at Old Trafford. All five of you own B.Fernandes and nobody owns the man he keeps finding." },
      { name:"Guéhi", team:"MCI", pos:"DEF", price:6.0, own:"19%", owned:0,
        text:"Twenty points from three, the same back line as Gvardiol, and £0.4m dearer. Two of you own Gvardiol. The clean sheet is shared; the goals are not." },
      { name:"Wirtz", team:"LIV", pos:"MID", price:7.4, own:"9%", owned:0,
        text:"Nine points is a slow start for £123m, and he is still on every set piece Liverpool take. Fulham at home is where a slow start ends." },
      { name:"Mateta", team:"CRY", pos:"FWD", price:6.4, own:"2%", owned:0,
        text:"Ipswich at home, the penalties, and the cheapest starting striker who is actually a starter. He is here so that Isak and Palmer can be." },
      { name:"Sels", team:"NFO", pos:"GK", price:5.0, own:"1%", owned:0,
        text:"Nine points and the most saves in the league. Villa away is hard, and a keeper who is busy scores anyway." },
    ],
    absent:{ name:"Haaland", text:"All five of you have him and all five have the armband on him. Old Trafford, then Porto on the Tuesday. I would rather spend his £15.5m on Isak, Mateta and the change than tell you what you already know." },
    watch:[
      { name:"Semenyo", team:"MCI", pos:"MID", price:8.4, own:"19%", status:"watch", text:"Thirteen points and the derby away. If he starts ahead of Cherki on Saturday he is in next week's side, and Cherki is in three of yours." },
      { name:"Cunha", team:"MUN", pos:"MID", price:7.9, own:"8%", status:"new", text:"Fourteen points and nobody in the room owns him. I chose Mbeumo this week; the derby decides which of them I keep." },
      { name:"Watkins", team:"AVL", pos:"FWD", price:7.8, own:"4%", status:"watch", text:"No points from three, and Forest at home. One goal and he is cheaper than anything you are playing up front." },
    ],
  };
  let who = "Ted";
  /* Ted's week has four states, and the mock lets you step through them. */
  const PHASES = [
    { id:"live", label:"Matches on", when:"Sat 6 Sep, 16:40" },
    { id:"done", label:"Just finished", when:"Sun 6 Sep, 20:10" },
    { id:"draft", label:"Midweek tinkering", when:"Wed 9 Sep" },
    { id:"frozen", label:"Deadline day", when:"Sat 12 Sep, 15:00" },
  ];
  let phase = "live";
  /* GW3 points for the fifteen. Illustrative: Ted's GW3 side is the same
     names so the states can be compared on one squad. */
  const PTS = { Sels:3, Gabriel:6, "Guéhi":8, Tarkowski:2, "Muñoz":1, Palmer:13, Mbeumo:7, Gakpo:9, Wirtz:2, Isak:8, Mateta:2, Rodon:6, Rice:3, Wood:1 };
  const DONE = { Sels:true, Gabriel:true, "Guéhi":true, Tarkowski:true, Palmer:true, Mbeumo:true, Gakpo:true, Isak:true, Rice:true };
  function phaseHTML() {
    return '<div class="mock-phase">mock only, step through Ted\u2019s week: ' + PHASES.map((p) =>
      '<button data-phase="' + p.id + '" aria-pressed="' + (p.id === phase) + '">' + esc(p.label) + '</button>').join("") + '</div>';
  }

  function barHTML() {
    const chips = FIVE.map((p) =>
      '<button class="gchip" data-nick="' + esc(p.nick) + '" aria-pressed="' + (p.nick === who) + '">' +
      '<span class="gface">' + face(p.nick) + '</span><span class="gmeta"><b>' + esc(p.nick) + '</b>' +
      '<span class="gteam">' + esc(p.team) + '</span><span class="gpts">' + p.pts + ' pts &middot; #' + p.rank + '</span></span></button>').join("");
    const ted = '<button class="gchip ghost" data-nick="Ted" aria-pressed="' + (who === "Ted") + '">' +
      '<span class="gface">' + face("Ted") + '</span><span class="gmeta"><b>Ted</b>' +
      '<span class="gteam">ghost manager</span><span class="gpts">fresh XI &middot; not in the league</span></span></button>';
    return '<div class="gbar" id="gbar">' + chips + ted + '</div>';
  }

  function tile(p) {
    return '<div class="pp">' +
      (p.captain ? '<span class="arm" title="Captain">C</span>' : "") +
      (p.vice ? '<span class="arm v" title="Vice-captain">V</span>' : "") +
      kit(p.team, p.pos === "GK") +
      '<a class="nb" data-player="' + esc(p.name) + '">' + esc(p.name) + '</a>' +
      (phase === "live" || phase === "done"
        ? (function(){ const over = phase === "done" || DONE[p.name]; const n = PTS[p.name] || 0; const m = p.captain ? 2 : 1;
            return over ? '<div class="vb">' + (n * m) + (m > 1 ? ' &times;2' : '') + '</div>'
                        : '<div class="vb f' + p.fdr + '">' + esc(p.fx) + '</div>'; })()
        : '<div class="vb f' + p.fdr + '">' + esc(p.fx) + '</div>') + '</div>';
  }

  function pitchHTML() {
    const rows = ["GK","DEF","MID","FWD"].map((pos) => TED.xi.filter((x) => x.pos === pos));
    const shape = rows.slice(1).map((r) => r.length).join("-");
    const xiPts = TED.xi.reduce((n, p) => n + (PTS[p.name] || 0) * (p.captain ? 2 : 1), 0);
    const line = phase === "live"
        ? '<span>Gameweek <b>3</b> &middot; 6 of 10 matches finished, 2 in play</span><span>points below are live, including provisional bonus</span>'
      : phase === "done"
        ? '<span>Gameweek <b>3</b> is final</span><span>picked from scratch, no transfers, no chips</span>'
      : phase === "draft"
        ? '<span>Gameweek <b>4</b> &middot; <b>draft</b>, changes until Sat 15:00</span><span><b>&pound;' + TED.spent.toFixed(1) + 'm</b> of &pound;100.0m</span>'
        : '<span>Gameweek <b>4</b> &middot; <b>team sheet in</b> Sat 15:00, three hours before the deadline</span><span><b>&pound;' + TED.spent.toFixed(1) + 'm</b> of &pound;100.0m</span>';
    const state = phase === "live" ? '<span class="gwstate live">in play</span>'
      : phase === "done" ? '<span class="gwstate">settled</span>'
      : phase === "draft" ? '<span class="gwstate">draft</span>' : '<span class="gwstate">frozen</span>';
    const total = (phase === "live" || phase === "done")
      ? '<strong>' + xiPts + '</strong> pts on the pitch &middot; <strong>' + TED.bench.reduce((n, p) => n + (PTS[p.name] || 0), 0) + '</strong> on the bench'
      : 'average difficulty <strong>2.91</strong>';
    const diff = phase === "draft"
      ? '<div class="diff"><span>since Tuesday:</span><span><i class="in">in</i> Wirtz</span><span><i class="out">out</i> Saka</span><span><i class="in">in</i> Mateta</span><span><i class="out">out</i> Haaland</span></div>' : '';
    return '<div class="panel"><h3>Ted&rsquo;s ' + shape + '</h3>' +
      '<div class="tedline">' + line + '</div>' + diff +
      '<div class="gwnav"><button disabled aria-label="Previous gameweek">&larr;</button><span class="gwlabel">Gameweek ' + (phase === "live" || phase === "done" ? 3 : 4) + '</span>' +
      '<button disabled aria-label="Next gameweek">&rarr;</button>' + state +
      '<span class="gwtotal">' + total + '</span></div>' +
      '<div class="pitchwrap"><div class="pitch">' +
      '<div class="chalk"><i class="box"></i><i class="box6"></i><i class="half"></i><i class="circle"></i></div>' +
      rows.map((r) => '<div class="prow">' + r.map(tile).join("") + '</div>').join("") +
      '</div><div class="benchlabel">Bench</div><div class="benchrow">' + TED.bench.map(tile).join("") + '</div></div></div>';
  }

  function ownedDots(n) {
    return '<span class="owned' + (n === 0 ? " none" : "") + '" title="' + n + ' of the five own him">' +
      [0,1,2,3,4].map((i) => '<i class="' + (i < n ? "on" : "") + '"></i>').join("") +
      ' ' + (n === 0 ? "none of you" : n + " of you") + '</span>';
  }

  function whyHTML() {
    return '<div class="panel"><h3>Why they&rsquo;re here</h3>' +
      '<p class="note">The ones most of you are not holding. Everyone you all own needs no defending.</p>' +
      TED.why.map((p) =>
        '<div class="whyrow">' + kit(p.team, p.pos === "GK") + '<div>' +
        '<div class="whyhead"><a data-player="' + esc(p.name) + '">' + esc(p.name) + '</a>' +
        '<span class="meta">' + esc(p.team) + ' &middot; ' + esc(p.pos) + ' &middot; &pound;' + p.price.toFixed(1) + 'm &middot; ' + esc(p.own) + '</span>' +
        ownedDots(p.owned) + '</div><p>' + esc(p.text) + '</p></div></div>').join("") +
      '<div class="nohaaland"><h4>Left out &middot; ' + esc(TED.absent.name) + '</h4><p>' + esc(TED.absent.text) + '</p></div>' +
      '</div>';
  }

  function watchHTML() {
    return '<div class="panel"><h3>Ted&rsquo;s watchlist</h3>' +
      '<p class="note">Not in this week&rsquo;s side. What gets them in.</p>' +
      TED.watch.map((p) =>
        '<div class="row"><div class="row-main"><div class="row-name">' +
        '<a class="plink" data-player="' + esc(p.name) + '">' + esc(p.name) + '</a> ' +
        '<span class="tag">' + esc(p.status) + '</span>' +
        '<span class="row-meta" style="font-family:var(--f-num);font-size:11.5px;color:var(--faint);margin-left:8px">' +
        esc(p.team) + ' &middot; ' + esc(p.pos) + ' &middot; &pound;' + p.price.toFixed(1) + 'm &middot; ' + esc(p.own) + '</span></div>' +
        '<p style="margin:4px 0 0;font-size:14px;line-height:1.5">' + esc(p.text) + '</p></div></div>').join("") +
      '</div>';
  }

  function rebuildHTML() {
    return '<div class="panel"><h3>Ted is rebuilding</h3><div class="rebuild">' +
      '<p>Gameweek 3 is done and the fifteen goes in the bin, all of it, every week. Palmer with the armband was the call that carried it; Wirtz and Mu&ntilde;oz were not.</p>' +
      '<p>A first draft for Gameweek 4 appears Tuesday, once the injury news and the press conferences are in. It changes through the week and freezes Saturday at 15:00, three hours before the deadline.</p>' +
      '<div class="clock"><span class="now"><b>Sun&ndash;Mon</b>thinking</span><span><b>Tue</b>first draft</span><span><b>Wed&ndash;Fri</b>tinkering</span><span><b>Sat 15:00</b>team sheet in</span><span><b>Sat 18:00</b>deadline</span></div>' +
      '</div></div>';
  }

  function xabiHTML() {
    return '<div class="panel"><h3>Xabi&rsquo;s 3-4-3</h3><p class="empty" style="padding:12px 0">Unchanged from today: the pitch, the weekly read (What worked / What didn&rsquo;t), the watchlist and The Big Decision. The only thing gone from this view is the roast panel that sat under it.</p></div>';
  }

  function render() {
    document.getElementById("main").innerHTML =
      '<div class="mock-note"><b>Mockup.</b> Three changes to the gaffers room, nothing else moves.' +
      '<ul><li>Ted joins the chip bar as a sixth face, dashed, with no points and no rank. He is not in the league and never will be.</li>' +
      '<li>His view has a pitch, a fresh fifteen every gameweek, and in place of What worked / What didn&rsquo;t he explains the players most of you are not holding. His own watchlist sits under it.</li>' +
      '<li>The roast panel is gone from every view.</li><li>Ted&rsquo;s week has four states: scores while matches are on, a rebuilding note once the week settles, a draft that changes midweek, and a frozen team sheet three hours before the deadline.</li></ul></div>' +
      phaseHTML() +
      '<section class="section"><div class="section-head"><h2>the gaffers</h2></div>' +
      barHTML() +
      (who === "Ted"
        ? (phase === "live" ? pitchHTML() + watchHTML()
          : phase === "done" ? pitchHTML() + rebuildHTML() + watchHTML()
          : pitchHTML() + whyHTML() + watchHTML())
        : xabiHTML()) +
      '</section>';
    document.querySelectorAll(".mock-phase button").forEach((b) => b.addEventListener("click", () => { phase = b.dataset.phase; who = "Ted"; render(); }));
    document.querySelectorAll("#gbar .gchip").forEach((b) => b.addEventListener("click", () => {
      who = b.dataset.nick === "Ted" ? "Ted" : "Xabi"; render();
    }));
  }
  render();

  const tc = document.getElementById("themectl");
  const setT = (t) => { if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
    tc.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.t === t)); try { localStorage.setItem("mock-theme", t); } catch (e) {} };
  tc.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setT(b.dataset.t); });
  let saved = "auto"; try { saved = localStorage.getItem("mock-theme") || "auto"; } catch (e) {}
  setT(saved);
})();
</script>
